mission_executive:
  ros__parameters:
    # autonomy.launch.py exposes auto_start_mission as a launch argument.
    auto_start_mission: false
    # Stream the active PX4-local setpoint independently of mission waits.
    setpoint_rate: 20.0
    path_speed: 0.75  # Metres per second along each planned path segment.
    path_turn_step_duration: 5.0  # Seconds per 60 degrees for path-facing turns.
    hold_duration: 0.5  # Continuous time within position and yaw tolerances.
    offboard_warmup: 2.0
    # Slow 60-degree scan ramps (5 degrees/s), followed by a stable detector dwell.
    sweep_step_duration: 12.0
    sweep_hold_duration: 3.0  # Continuous settled time at each of the six headings.
    position_tolerance: 0.3
    yaw_tolerance: 0.0872664626  # Radians: 5 degrees.
    takeoff_altitude_tolerance: 0.3
    service_timeout: 10.0
    takeoff_timeout: 120.0
    waypoint_timeout: 60.0
    # PX4 HEARTBEAT (and MAVROS state) is only 1 Hz. Match MAVROS conn_timeout.
    state_timeout: 10.0
    # Local odometry is a separate, high-rate stream; keep its stricter deadline.
    telemetry_timeout: 2.0
    planning_timeout: 10.0
    mode_timeout: 10.0
    transform_timeout: 0.5
    takeoff_altitude_parameter: MIS_TAKEOFF_ALT
    local_odometry_topic: /mavros/local_position/odom
    local_frame: px4_odom
    # Stock MAVROS labels these PX4-local coordinates "map". Normalize only
    # this subscribed input label; planner map paths still need origin alignment.
    # Use [px4_odom] to require the canonical local_frame exactly.
    local_odometry_frame_aliases: [map]
    # A fresh valid return/reserve alert aborts the mission and requests LOITER.
    battery_alert_topic: battery_return_estimate
    battery_alert_timeout: 5.0
    # Verify receives the same detector streams as the detection monitor.
    # autonomy.launch.py exposes detector, planning-frame and GPS overrides.
    smoke_detection_topic: /kv_drone/smoke/detection
    fire_detection_topic: /kv_drone/fire/detection
    verify_planning_frame: map
    global_position_topic: /mavros/global_position/global
    global_position_timeout: 2.0
    # Bounded compressed snapshots. Images may be missing without changing the finding.
    inspection_report_history: 2
    inspection_evidence_rgb_topic: /kv_drone/rgb_camera/image
    inspection_evidence_thermal_topic: /kv_drone/thermal_camera/image
    inspection_evidence_timeout: 3.0
    inspection_evidence_max_age: 2.0
    inspection_evidence_pair_slop: 0.5
    inspection_evidence_cache_bytes: 16777216
    inspection_evidence_cache_frames: 3
    inspection_evidence_frame_bytes: 8388608
    inspection_evidence_rgb_max_bytes: 262144
    inspection_evidence_thermal_max_bytes: 1048576
    inspection_evidence_rgb_max_side: 1280
    inspection_evidence_rgb_quality: 80
    inspection_evidence_pose_history: 128
    inspection_evidence_pose_slop: 0.25
    # Final yaw/visual check uses retained wall coordinates, with no wall re-ranging.
    verify_report_view_timeout: 15.0
    verify_report_view_yaw_tolerance: 0.5235987755982988
    verify_path_step: 0.25  # Metres between guarded path targets.
    fire_exclusion_radius: 15.0  # Exploration endpoint exclusion, in metres.
    verify_observation_timeout: 2.0
    verify_future_tolerance: 0.25
    # Accept the detector's fresh confirmed persistence metadata. Messages
    # without that evidence use the executive's same-track confirmation fallback.
    verify_fire_persistence: 1.5
    verify_fire_min_frames: 3
    verify_track_center_tolerance: 0.08  # Fraction of image dimensions.
    verify_track_area_ratio: 2.0
    verify_reacquire_timeout: 15.0
    # Wait for detector confirmation after arrival, brief misses within SEARCH/
    # CENTER, and each recovery viewpoint; keep the current state while waiting.
    # This waiting budget does not relax the source-image age limit above.
    verify_reacquire_observation_timeout: 5.0
    verify_reacquire_scan_step: 0.17453292519943295  # Missing-source scan +/-10 degrees.
    verify_reacquire_yaw_step: 0.08726646259971647  # Visible-source corrections <=5 degrees.
    # Historical camera bearings retain fire priority briefly through missed detections.
    verify_fire_heading_grace: 2.0
    verify_heading_rate: 0.20943951023931956  # 12 degrees per source second.
    verify_heading_clock_timeout: 5.0
    verify_fire_heading_tolerance: 0.03490658503988659  # 2 degrees when stopped.
    verify_fire_heading_align_timeout: 15.0
    # A continuous dwell uses distinct fresh poses, low speed and low rotation.
    verify_settle_dwell: 1.0
    verify_settle_timeout: 15.0
    verify_settle_map_timeout: 15.0
    verify_settle_speed: 0.10
    verify_settle_angular_rate: 0.05235987755982989  # 3 degrees per source second.
    verify_settle_clock_timeout: 5.0
    # Failed Verify delays manual requests briefly. Automatic repeats of the
    # same blocked bearing wait for 2 m actual translation; a new bearing can
    # still interrupt the sweep. These are observer/bearing gates, not ranges.
    verify_retry_cooldown: 2.0
    verify_retry_translation: 2.0
    # Successful sites persist; the translation retry rule applies only to inconclusive views.
    verify_completed_cluster_radius: 20.0
    verify_completed_cluster_buffer: 5.0
    verify_departure_timeout: 180.0
    verify_departure_step: 3.0
    verify_departure_max_legs: 12
    verify_departure_clearance: 1.0
    verify_retry_bearing_tolerance: 0.2617993877991494  # 15 degrees.
    # Legacy centering budget, retained for existing parameter files. Smoke
    # pursuit now uses forward guidance rather than separate axis corrections.
    verify_smoke_center_timeout: 30.0
    # Remember the last confirmed smoke bearing through occlusion. Hold this
    # long since its last accepted image before any reacquisition yaw scan.
    verify_smoke_loss_grace: 5.0
    # Safe lateral smoke-boundary observation offsets; every translation uses
    # plan_inspection_path. Missing observations permit yaw scans, not blind flight.
    verify_viewpoint_climb: 2.0
    verify_viewpoint_lateral_step: 2.0
    verify_viewpoint_max_steps: 3
    verify_viewpoint_timeout: 60.0
    verify_center_timeout: 30.0
    # CENTER_FIRE: short committed moves toward the observed smoke wall,
    # requiring fresh fire confirmation after each stop.
    # Reaching a step/time limit never substitutes for measured wall proximity.
    verify_fire_approach_max_steps: 64
    # CENTER_FIRE uses a 3 x 3 m observed smoke wall, not fire range.
    verify_fire_leg_max_length: 12.0  # Actual planned route length, metres.
    verify_fire_leg_timeout: 60.0  # Execution only; includes safe mode recovery on expiry.
    verify_fire_standoff: 10.0  # Legacy parameter; CENTER_FIRE uses verify_smoke_standoff.
    verify_yaw_tolerance: 0.08726646259971647  # Radians: 5 degrees.
    verify_yaw_step: 0.5235987755982988  # Radians: at most 30 degrees per correction.
    verify_vertical_step: 0.5
    # Height goals must converge separately from the ordinary 0.3 m arrival radius.
    verify_vertical_position_tolerance: 0.05
    verify_vertical_minimum_change: 0.10
    # Fire-guided altitude goals are chosen between committed legs. The target
    # may descend only when observed terrain and the full corridor permit it.
    verify_vertical_tolerance: 0.08726646259971647  # Stop correcting inside 5 degrees.
    verify_vertical_hysteresis: 0.03490658503988659  # Start outside 7 degrees.
    verify_vertical_edge_threshold: 0.2617993877991494  # 15 degrees: final centering edge threshold.
    verify_vertical_max_corrections: 3  # Best-effort vertical attempts at the standoff.
    # One remembered correction outside the normal 7-degree activation threshold,
    # within the same short movement / 15 degrees of yaw. Slow simulation is allowed.
    verify_vertical_memory_timeout: 15.0  # Source/ROS seconds since the confirmed image.
    verify_vertical_clock_timeout: 5.0  # Wall seconds without simulated-clock progress.
    verify_wall_probe_timeout: 0.5  # One opportunistic query; missing range allows approach.
    verify_wall_recheck_timeout: 20.0  # Bounded revalidation of a suspected nearby wall.
    verify_minimum_altitude: 2.0  # Local z floor; planner home limits also apply.
    # Legacy coverage-to-step parameters remain accepted for compatibility.
    # Active smoke acquisition uses verify_navigation_step with measured terrain
    # checks. Selected smoke legs finish through fire/smoke detector changes;
    # fresh fire adjusts yaw and receives priority after arrival.
    verify_step_min: 5.0
    verify_step_max: 20.0
    # Legacy broad-smoke threshold; measured proximity gates inspection reports.
    verify_full_coverage: 0.25
    verify_motion_speed: 0.5
    # Keep the aircraft level; these position setpoints cannot safely request tilt.
    verify_search_hold: 5.0
    verify_search_center_timeout: 15.0  # Best effort; partial smoke remains usable.
    # Independent limits for movement failures, fire-loss retries and settling failures.
    verify_search_recovery_max: 3
    verify_localization_max_steps: 6  # Legacy; fire range never gates navigation.
    # Short smoke-guided goals in both APPROACH_SMOKE and SEARCH_FIRE.
    # Inspection paths retain occupied-obstacle and measured terrain checks.
    verify_navigation_step: 3.0
    verify_navigation_preferred_agl: 7.5
    verify_navigation_max_agl: 10.0
    verify_navigation_candidate_limit: 18
    verify_navigation_map_wait: 5.0
    # Maximum wait per continuous map outage. A fresh map ends that outage;
    # healthy planning and mode handoffs do not consume the next outage's wait.
    # Persistent clearance failures share a bounded budget at the same position.
    verify_navigation_map_timeout: 20.0
    verify_navigation_no_progress_max: 2
    # Proximity to a fresh observed plume/smoke-wall proxy, never fire distance.
    verify_smoke_standoff: 15.0
    verify_smoke_inspection_max_distance: 20.0
    # Ordinary approach never uses large detours or climbs to chase an endpoint.
    verify_approach_max_rise: 1.0
    verify_approach_max_drop: 1.0
    verify_approach_max_backtrack: 0.3
    verify_approach_max_path_length: 12.0
    # These wider limits require a measured current hazard or confirmed near wall.
    verify_recovery_max_rise: 6.0
    verify_recovery_max_drop: 1.0
    verify_recovery_max_backtrack: 3.3
    # Clearance above a validated observed support surface; unknown means no descent.
    verify_inspection_altitude: 3.0
    verify_inspection_lateral_step: 5.0
    verify_inspection_max_attempts: 3
    verify_inspection_yaw_step: 0.08726646259971647  # +/-5 degree inspection checks.
    # Starts with confirmed fire or measured boundary inspection, not broad coverage.
    verify_inspection_timeout: 600.0
    verify_inspection_max_range: 40.0
    verify_inspection_max_uncertainty: 2.0
    verify_geometry_timeout: 5.0
    verify_max_approaches: 64
