motion_planner:
  ros__parameters:
    horizontal_range: 15.0
    vertical_range: 5.0
    minimum_altitude: 2.0
    maximum_altitude: 200.0
    # A 2 m lower bound permits PX4's default 2.5 m takeoff altitude.
    # Obstacle clearance is configured separately below.
    bound_margin: 0.0
    yaw_weight: 1.0
    # 500 mm base plus two 127 mm propeller radii gives a 377 mm radius.
    # This is rounded up to provide a small physical safety margin.
    drone_radius: 0.45
    obstacle_clearance: 0.30
    validity_resolution_fraction: 0.005
    planning_timeout: 2.0
    simplification_time: 0.2
    # Latch the first external-odometry pose as home so altitude limits use the
    # same origin as the map. Set false to use MAVROS HomePosition instead.
    home_from_first_odometry: true
    home_position_topic: /mavros/home_position/home
    octomap_topic: /octomap_binary
    mavros_parameter_service: /mavros/param/get_parameters
    transform_timeout: 0.2
    # Explicit Verify/retreat goals may extend beyond the exploration window,
    # while still respecting home altitude limits and collision clearance.
    maximum_target_distance: 50.0
    # Known fire reports exclude exploration endpoints around the observation
    # viewpoint. Explicit targets and paths through these regions remain valid.
    reported_site_exclusion_radius: 15.0
    maximum_reported_sites: 100
    # Match Exploration's occupied-voxel policy for limited-FOV lidar. Strict
    # observed-free air can be required when the sensor covers the whole body.
    # Occupied history, observed terrain, minimum AGL and inflated body stay checked.
    inspection_require_observed_free_space: false
    # Source observation age uses ROS time, including slow simulation time.
    # Wall time bounds reception silence with a real clock, or a frozen /clock
    # in simulation. A progressing slow simulation does not age maps early.
    # The same source deadline also bounds occupied-map history.
    inspection_map_timeout: 5.0
    inspection_future_tolerance: 0.25
    inspection_max_range: 50.0
    inspection_ground_patch_radius: 0.5
    # Extended smoke-wall candidates group front/background returns separately.
    # Each group's complete depth span stays bounded; legacy probes are unchanged.
    inspection_wall_cluster_span: 4.0
